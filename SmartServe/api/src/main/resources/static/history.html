<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartServe | My History</title>
    <style>
        .history-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.history-card {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px;
    background: #f9f9f9;
    box-shadow: 2px 2px 10px rgba(0,0,0,0.05);
}

.otp-badge {
    display: inline-block;
    background: #27ae60;
    color: white;
    padding: 5px 10px;
    border-radius: 4px;
    font-weight: bold;
    font-family: monospace;
    font-size: 1.2rem;
}

.status-tag {
    float: right;
    text-transform: uppercase;
    font-size: 0.8rem;
    font-weight: bold;
}

.status-pending { color: #f39c12; }
.status-claimed { color: #27ae60; }
    </style>
</head>
<body>
    <div class="container">
        <h2>History & Tracking</h2>
        
        <section id="customer-history">
            <h3>My Claimed Food (Order History)</h3>
            <div id="order-list" class="history-grid">
                </div>
        </section>

        <hr>

        <section id="donor-history">
            <h3>My Food Listings (Donor History)</h3>
            <div id="listing-list" class="history-grid">
                </div>
        </section>
    </div>

    <script>
        const API_BASE = "https://smartserve-api-lolg.onrender.com/api";
const CURRENT_USER_ID = 1; // Replace with your actual logged-in User ID

document.addEventListener("DOMContentLoaded", () => {
    loadCustomerOrders();
    loadDonorListings();
});

// 1. Fetch Customer Order History (Claims + OTPs)
async function loadCustomerOrders() {
    try {
        const response = await fetch(`${API_BASE}/claims/history/customer/${CURRENT_USER_ID}`);
        const claims = await response.json();
        const container = document.getElementById('order-list');

        container.innerHTML = claims.map(claim => `
            <div class="history-card">
                <span class="status-tag status-${claim.status.toLowerCase()}">${claim.status}</span>
                <h4>${claim.food.title}</h4>
                <p>📍 ${claim.food.addressText}</p>
                <div class="otp-container">
                    <small>Your Pick-up OTP:</small><br>
                    <span class="otp-badge">${claim.otpCode}</span>
                </div>
                <p><small>Claimed on: ${new Date(claim.claimDate).toLocaleDateString()}</small></p>
            </div>
        `).join('');
    } catch (err) {
        console.error("Error loading orders:", err);
    }
}

// 2. Fetch Donor Food Listing History
async function loadDonorListings() {
    try {
        const response = await fetch(`${API_BASE}/food/donor/${CURRENT_USER_ID}`);
        const listings = await response.json();
        const container = document.getElementById('listing-list');

        container.innerHTML = listings.map(item => `
            <div class="history-card">
                <span class="status-tag status-${item.status.toLowerCase()}">${item.status}</span>
                <h4>${item.title}</h4>
                <p>Quantity: ${item.quantity}</p>
                <p>Listed: ${new Date(item.createdAt).toLocaleDateString()}</p>
                ${item.status === 'AVAILABLE' ? '<button class="btn-manage">Manage</button>' : ''}
            </div>
        `).join('');
    } catch (err) {
        console.error("Error loading listings:", err);
    }
}
    </script>
</body>
</html>
